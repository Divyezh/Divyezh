<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
<rect width="480" height="200" rx="14" fill="#0A0A0C" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
<text x="24" y="34" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="17" fill="#F4F4F5">Top Languages</text>

<g font-family="'JetBrains Mono',monospace" font-size="12.5" fill="#A1A1AA">
  <!-- TypeScript -->
  <text x="24" y="66">TypeScript</text><text x="430" y="66" fill="#FFAA44" font-weight="600" text-anchor="end">42%</text>
  <rect x="24" y="74" width="406" height="6" rx="3" fill="#1A1A20"/>
  <rect x="24" y="74" width="0" height="6" rx="3" fill="#3178C6"><animate attributeName="width" from="0" to="170" dur="1s" begin="0.2s" fill="freeze"/></rect>

  <!-- JavaScript -->
  <text x="24" y="98">JavaScript (React / Node)</text><text x="430" y="98" fill="#FFAA44" font-weight="600" text-anchor="end">28%</text>
  <rect x="24" y="106" width="406" height="6" rx="3" fill="#1A1A20"/>
  <rect x="24" y="106" width="0" height="6" rx="3" fill="#E8821A"><animate attributeName="width" from="0" to="114" dur="1s" begin="0.4s" fill="freeze"/></rect>

  <!-- CSS / Tailwind -->
  <text x="24" y="130">CSS &amp; Tailwind CSS</text><text x="430" y="130" fill="#FFAA44" font-weight="600" text-anchor="end">15%</text>
  <rect x="24" y="138" width="406" height="6" rx="3" fill="#1A1A20"/>
  <rect x="24" y="138" width="0" height="6" rx="3" fill="#38BDF8"><animate attributeName="width" from="0" to="61" dur="1s" begin="0.6s" fill="freeze"/></rect>

  <!-- Python / SQL -->
  <text x="24" y="162">Python &amp; SQL</text><text x="430" y="162" fill="#FFAA44" font-weight="600" text-anchor="end">10%</text>
  <rect x="24" y="170" width="406" height="6" rx="3" fill="#1A1A20"/>
  <rect x="24" y="170" width="0" height="6" rx="3" fill="#10B981"><animate attributeName="width" from="0" to="41" dur="1s" begin="0.8s" fill="freeze"/></rect>

  <!-- Other -->
  <text x="24" y="190">HTML &amp; Shell</text><text x="430" y="190" fill="#71717A" font-weight="600" text-anchor="end">5%</text>
</g>
</svg>
