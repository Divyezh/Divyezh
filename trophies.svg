<svg width="760" height="170" viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg">
<g id="cells" font-family="'Space Grotesk',sans-serif">
  <!-- Cell 1: WebRTC P2P (Amber) -->
  <g transform="translate(10,10)">
    <g opacity="0"><animateTransform attributeName="transform" type="scale" from="0.7" to="1" dur="0.4s" begin="0.1s" fill="freeze" additive="sum"/><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
      <rect width="115" height="150" rx="12" fill="#121216" stroke="#E8821A" stroke-width="1.2"/>
      <text x="57" y="48" text-anchor="middle" font-size="28">📹</text>
      <text x="57" y="82" text-anchor="middle" font-size="12" fill="#F4F4F5" font-weight="700">WebRTC Mesh</text>
      <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#A1A1AA">Rank S</text>
      <rect x="25" y="118" width="65" height="20" rx="10" fill="#1A1A20" stroke="#E8821A" stroke-width="1"/>
      <text x="57" y="132" text-anchor="middle" font-size="9.5" fill="#FFAA44" font-weight="700">FLAGSHIP</text>
    </g>
  </g>

  <!-- Cell 2: Commits (Green) -->
  <g transform="translate(135,10)">
    <g opacity="0"><animateTransform attributeName="transform" type="scale" from="0.7" to="1" dur="0.4s" begin="0.25s" fill="freeze" additive="sum"/><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.25s" fill="freeze"/>
      <rect width="115" height="150" rx="12" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
      <text x="57" y="48" text-anchor="middle" font-size="28">⚡</text>
      <text x="57" y="82" text-anchor="middle" font-size="12" fill="#F4F4F5" font-weight="700">Commits</text>
      <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#A1A1AA">Rank A+</text>
      <rect x="25" y="118" width="65" height="20" rx="10" fill="#1A1A20" stroke="#22C55E" stroke-width="1"/>
      <text x="57" y="132" text-anchor="middle" font-size="9.5" fill="#22C55E" font-weight="700">ACTIVE</text>
    </g>
  </g>

  <!-- Cell 3: Stars (Gold) -->
  <g transform="translate(260,10)">
    <g opacity="0"><animateTransform attributeName="transform" type="scale" from="0.7" to="1" dur="0.4s" begin="0.4s" fill="freeze" additive="sum"/><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
      <rect width="115" height="150" rx="12" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
      <text x="57" y="48" text-anchor="middle" font-size="28">⭐</text>
      <text x="57" y="82" text-anchor="middle" font-size="12" fill="#F4F4F5" font-weight="700">Stars</text>
      <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#A1A1AA">Rank A</text>
      <rect x="25" y="118" width="65" height="20" rx="10" fill="#1A1A20" stroke="#E8821A" stroke-width="1"/>
      <text x="57" y="132" text-anchor="middle" font-size="9.5" fill="#FFAA44" font-weight="700">GOLD</text>
    </g>
  </g>

  <!-- Cell 4: 3D Graphics (Violet) -->
  <g transform="translate(385,10)">
    <g opacity="0"><animateTransform attributeName="transform" type="scale" from="0.7" to="1" dur="0.4s" begin="0.55s" fill="freeze" additive="sum"/><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.55s" fill="freeze"/>
      <rect width="115" height="150" rx="12" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
      <text x="57" y="48" text-anchor="middle" font-size="28">🌐</text>
      <text x="57" y="82" text-anchor="middle" font-size="12" fill="#F4F4F5" font-weight="700">Three.js / Sim</text>
      <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#A1A1AA">Rank A</text>
      <rect x="25" y="118" width="65" height="20" rx="10" fill="#1A1A20" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="57" y="132" text-anchor="middle" font-size="9.5" fill="#F4F4F5" font-weight="700">EXPERT</text>
    </g>
  </g>

  <!-- Cell 5: Frontend (Blue) -->
  <g transform="translate(510,10)">
    <g opacity="0"><animateTransform attributeName="transform" type="scale" from="0.7" to="1" dur="0.4s" begin="0.7s" fill="freeze" additive="sum"/><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
      <rect width="115" height="150" rx="12" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
      <text x="57" y="48" text-anchor="middle" font-size="28">💻</text>
      <text x="57" y="82" text-anchor="middle" font-size="12" fill="#F4F4F5" font-weight="700">React 19</text>
      <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#A1A1AA">Rank S</text>
      <rect x="25" y="118" width="65" height="20" rx="10" fill="#1A1A20" stroke="#3178C6" stroke-width="1"/>
      <text x="57" y="132" text-anchor="middle" font-size="9.5" fill="#38BDF8" font-weight="700">MASTER</text>
    </g>
  </g>

  <!-- Cell 6: MultiLang (Amber) -->
  <g transform="translate(635,10)">
    <g opacity="0"><animateTransform attributeName="transform" type="scale" from="0.7" to="1" dur="0.4s" begin="0.85s" fill="freeze" additive="sum"/><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.85s" fill="freeze"/>
      <rect width="115" height="150" rx="12" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
      <text x="57" y="48" text-anchor="middle" font-size="28">🏆</text>
      <text x="57" y="82" text-anchor="middle" font-size="12" fill="#F4F4F5" font-weight="700">MultiLang</text>
      <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#A1A1AA">Rank A</text>
      <rect x="25" y="118" width="65" height="20" rx="10" fill="#1A1A20" stroke="#E8821A" stroke-width="1"/>
      <text x="57" y="132" text-anchor="middle" font-size="9.5" fill="#FFAA44" font-weight="700">PRO</text>
    </g>
  </g>
</g>
</svg>
