<rect x="-120" y="0" width="80" height="180" fill="url(#trophyShine)" transform="skewX(-15)">
  <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;950,0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
