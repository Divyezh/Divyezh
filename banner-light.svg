  <text x="50" y="345" opacity="0">AI / SaaS Builder<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.34;0.5;0.55;1" dur="10s" begin="2.8s" repeatCount="indefinite"/></text>
  <text x="50" y="345" opacity="0">Creator of VELVET.AI<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.62;0.78;0.83;1" dur="10s" begin="2.8s" repeatCount="indefinite"/></text>
