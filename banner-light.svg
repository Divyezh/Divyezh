<circle cx="120" cy="620" r="160" fill="#FF7A00" opacity="0.06"><animate attributeName="opacity" values="0.03;0.09;0.03" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1150" cy="120" r="130" fill="#FFB347" opacity="0.06"><animate attributeName="opacity" values="0.03;0.09;0.03" dur="8s" repeatCount="indefinite"/></circle>

