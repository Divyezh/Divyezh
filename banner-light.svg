<svg width="1280" height="740" viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="55%" stop-color="#FFF3E8"><animate attributeName="stop-color" values="#FFF3E8;#FFE4CC;#FFF3E8" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#FFFFFF"/>
  </linearGradient>
  <linearGradient id="nameGradL" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#D63A00"><animate attributeName="stop-color" values="#D63A00;#FF7A00;#E85D00;#D63A00" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#E85D00"><animate attributeName="stop-color" values="#E85D00;#D63A00;#FF7A00;#E85D00" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#FF7A00"><animate attributeName="stop-color" values="#FF7A00;#E85D00;#D63A00;#FF7A00" dur="5s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="scanGradL" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FF7A00" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FF9E5E" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="roundedBannerL"><rect width="1280" height="740" rx="22"/></clipPath>
  <clipPath id="charClipL"><rect x="924" y="0" width="330" height="0"><animate attributeName="height" from="0" to="740" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
</defs>

<g clip-path="url(#roundedBannerL)">
