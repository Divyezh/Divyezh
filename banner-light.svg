<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="bannerClipL"><rect width="1280" height="560" rx="18"/></clipPath>
</defs>

<g clip-path="url(#bannerClipL)">
  <!-- Light theme warm paper background -->
  <rect width="1280" height="560" fill="#FAF7F2"/>

  <!-- Subtle grid mesh -->
  <g opacity="0.4" stroke="#E4E0D8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="560"/>
    <line x1="320" y1="0" x2="320" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/>
    <line x1="640" y1="0" x2="640" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
    <line x1="960" y1="0" x2="960" y2="560"/>
    <line x1="1120" y1="0" x2="1120" y2="560"/>
  </g>

  <!-- LEFT COLUMN: Identity & Info -->
  <g transform="translate(64,52)">
    <!-- Status Pill -->
    <rect width="390" height="32" rx="16" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#16A34A"/>
    <text x="34" y="21" font-family="'Inter','Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#71717A">
      Open to internships · Ahmedabad / Remote
    </text>

    <!-- Name H1 -->
    <text x="0" y="112" font-family="'Space Grotesk','Poppins',sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#18181B">
      Divyesh Soni
    </text>

    <!-- Role Subtitle -->
    <g font-family="'Space Grotesk','Poppins',sans-serif" font-size="24" font-weight="600" fill="#C2650D">
      <text x="2" y="152" opacity="0">Full-Stack WebRTC &amp; Frontend Engineer<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.25;0.30;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="2" y="152" opacity="0">Creator of VIVA — P2P Video Conferencing<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.30;0.33;0.58;0.63;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="2" y="152" opacity="0">Real-Time Systems &amp; 3D Web Builder<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.63;0.66;0.95;1;1" dur="9s" repeatCount="indefinite"/></text>
    </g>

    <!-- Positioning Line -->
    <text x="2" y="196" font-family="'Inter','Segoe UI',sans-serif" font-size="16.5" font-weight="400" fill="#52525B">
      "I build real-time, high-performance web products."
    </text>

    <!-- Lead Project Card -->
    <g transform="translate(0,224)">
      <rect width="560" height="84" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
      <rect x="0" y="0" width="4" height="84" rx="2" fill="#C2650D"/>
      <text x="20" y="28" font-family="'Space Grotesk',sans-serif" font-size="15" font-weight="700" fill="#18181B">
        📹 Flagship: VIVA Meeting
      </text>
      <text x="20" y="50" font-family="'Inter',sans-serif" font-size="13" fill="#52525B">
        Native WebRTC mesh video conferencing with host admission &amp; audio detection.
      </text>
      <text x="20" y="70" font-family="'JetBrains Mono',monospace" font-size="11" fill="#C2650D">
        React 19 · Socket.io · Zero SDK Fees · Lossless Screen Share
      </text>
    </g>

    <!-- Grouped Skill Chips (NO percentage bars) -->
    <g transform="translate(0,332)" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="500">
      <text x="0" y="0" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#71717A">CORE TECHNOLOGIES</text>
      
      <!-- Row 1 -->
      <g transform="translate(0,12)">
        <rect width="84" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="42" y="18" text-anchor="middle" fill="#18181B">WebRTC</text>
        <g transform="translate(92,0)"><rect width="90" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="45" y="18" text-anchor="middle" fill="#18181B">Socket.io</text></g>
        <g transform="translate(190,0)"><rect width="88" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="44" y="18" text-anchor="middle" fill="#18181B">React 19</text></g>
        <g transform="translate(286,0)"><rect width="86" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="43" y="18" text-anchor="middle" fill="#18181B">Next.js</text></g>
        <g transform="translate(380,0)"><rect width="102" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="51" y="18" text-anchor="middle" fill="#18181B">TypeScript</text></g>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0,48)">
        <rect width="86" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="43" y="18" text-anchor="middle" fill="#18181B">Three.js</text>
        <g transform="translate(94,0)"><rect width="106" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="53" y="18" text-anchor="middle" fill="#18181B">Tailwind v4</text></g>
        <g transform="translate(208,0)"><rect width="82" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="41" y="18" text-anchor="middle" fill="#18181B">Node.js</text></g>
        <g transform="translate(298,0)"><rect width="78" height="28" rx="6" fill="#F4EFE6" stroke="#E4E0D8"/><text x="39" y="18" text-anchor="middle" fill="#18181B">Docker</text></g>
        <g transform="translate(384,0)"><rect width="98" height="28" rx="6" fill="#FDF3E7" stroke="#E8821A"/><text x="49" y="18" text-anchor="middle" fill="#C2650D">Full-Stack</text></g>
      </g>
    </g>

    <!-- CTAs Row -->
    <g transform="translate(0,442)">
      <rect width="168" height="38" rx="8" fill="#C2650D"/>
      <text x="84" y="24" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">View VIVA Meeting →</text>

      <g transform="translate(180,0)">
        <rect width="154" height="38" rx="8" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
        <text x="77" y="24" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="13.5" font-weight="600" fill="#18181B">Download Résumé</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: WebRTC Mesh Diagram -->
  <g transform="translate(710,40)">
    <rect width="506" height="476" rx="16" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
    
    <g transform="translate(24,24)">
      <circle cx="6" cy="6" r="4.5" fill="#EF4444"/>
      <circle cx="22" cy="6" r="4.5" fill="#F59E0B"/>
      <circle cx="38" cy="6" r="4.5" fill="#16A34A"/>
      <text x="60" y="10" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#71717A">webrtc-mesh-topology.canvas</text>
      <rect x="350" y="-3" width="96" height="20" rx="10" fill="#FDF3E7" stroke="#E8821A"/>
      <text x="398" y="11" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#C2650D">P2P ACTIVE</text>
    </g>

    <g transform="translate(24,60)">
      <g stroke="#C2650D" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4 4">
        <line x1="230" y1="180" x2="100" y2="90"/>
        <line x1="230" y1="180" x2="360" y2="90"/>
        <line x1="230" y1="180" x2="80" y2="270"/>
        <line x1="230" y1="180" x2="380" y2="270"/>
        <line x1="230" y1="180" x2="230" y2="360"/>
        <line x1="100" y1="90" x2="360" y2="90"/>
        <line x1="100" y1="90" x2="80" y2="270"/>
        <line x1="360" y1="90" x2="380" y2="270"/>
        <line x1="80" y1="270" x2="230" y2="360"/>
        <line x1="380" y1="270" x2="230" y2="360"/>
      </g>

      <circle r="3.5" fill="#C2650D">
        <animateMotion path="M 100,90 L 230,180 L 380,270" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#C2650D">
        <animateMotion path="M 360,90 L 230,180 L 80,270" dur="2.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Center Hub -->
      <g transform="translate(230,180)">
        <circle r="34" fill="#FAF7F2" stroke="#C2650D" stroke-width="2"/>
        <text y="-6" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700" fill="#C2650D">SIGNAL</text>
        <text y="10" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#71717A">Socket.io</text>
      </g>

      <!-- Peer 1 -->
      <g transform="translate(100,90)">
        <circle r="26" fill="#F4EFE6" stroke="#16A34A" stroke-width="2"/>
        <text y="4" text-anchor="middle" font-size="18">👨‍💻</text>
        <text y="38" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600" fill="#16A34A">Host (Admit)</text>
      </g>

      <!-- Peer 2 -->
      <g transform="translate(360,90)">
        <circle r="24" fill="#F4EFE6" stroke="#E4E0D8" stroke-width="1.5"/>
        <text y="4" text-anchor="middle" font-size="17">👩‍💼</text>
        <text y="36" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#71717A">Peer B</text>
      </g>

      <!-- Peer 3 -->
      <g transform="translate(80,270)">
        <circle r="24" fill="#F4EFE6" stroke="#E4E0D8" stroke-width="1.5"/>
        <text y="4" text-anchor="middle" font-size="17">👨‍🔬</text>
        <text y="36" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#71717A">Peer C</text>
      </g>

      <!-- Peer 4 -->
      <g transform="translate(380,270)">
        <circle r="24" fill="#F4EFE6" stroke="#E4E0D8" stroke-width="1.5"/>
        <text y="4" text-anchor="middle" font-size="17">👩‍💻</text>
        <text y="36" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#71717A">Peer D</text>
      </g>

      <!-- STUN -->
      <g transform="translate(230,360)">
        <rect x="-48" y="-14" width="96" height="28" rx="6" fill="#F4EFE6" stroke="#C2650D" stroke-width="1"/>
        <text y="4" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600" fill="#C2650D">Google STUN</text>
      </g>
    </g>

    <g transform="translate(24,432)" font-family="'JetBrains Mono',monospace" font-size="11" fill="#71717A">
      <text x="0" y="0">RTT: <tspan fill="#16A34A">18ms</tspan></text>
      <text x="120" y="0">Jitter: <tspan fill="#16A34A">2ms</tspan></text>
      <text x="230" y="0">Topology: <tspan fill="#C2650D">Full Mesh</tspan></text>
      <text x="370" y="0">Bandwidth: <tspan fill="#18181B">Lossless</tspan></text>
    </g>
  </g>
</g>

<rect width="1280" height="560" rx="18" fill="none" stroke="#E4E0D8" stroke-width="1"/>
</svg>
