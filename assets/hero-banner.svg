<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#1a0500;#000000" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF4500">
        <animate attributeName="stop-color" values="#FF4500;#FF7A00;#FF4500" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" fill="url(#bgGrad)" rx="12"/>

  <circle r="6" fill="#FFB347">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M 60,100 A 40,40 0 1 1 60,100.1" />
  </circle>

  <circle cx="150" cy="40" r="2" fill="#FF7A00" opacity="0.7">
    <animate attributeName="cy" values="40;160;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="150" r="2.5" fill="#FFB347" opacity="0.6">
    <animate attributeName="cy" values="150;20;150" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="60" r="1.8" fill="#FF4500" opacity="0.8">
    <animate attributeName="cy" values="60;180;60" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="500" y="95" font-family="'Fira Code', monospace" font-size="42" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">
    Hi, I'm Divyesh 👋
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="500" y="135" font-family="'Fira Code', monospace" font-size="18"
        fill="#FFD9B3" text-anchor="middle" opacity="0">
    Frontend Developer · AI / SaaS Builder · Creator of VELVET.AI
    <animate attributeName="opacity" values="0;0;1" dur="2.4s" fill="freeze"/>
  </text>

  <rect x="300" y="150" width="0" height="3" fill="#FF7A00" rx="2">
    <animate attributeName="width" values="0;400" dur="1.5s" begin="1.5s" fill="freeze"/>
    <animate attributeName="x" values="500;300" dur="1.5s" begin="1.5s" fill="freeze"/>
  </rect>
</svg>
