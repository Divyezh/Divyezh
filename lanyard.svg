<svg width="360" height="520" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <linearGradient id="strap" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#B83A00"/>
    <stop offset="50%" stop-color="#FF4500"/>
    <stop offset="100%" stop-color="#B83A00"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#141414"/>
    <stop offset="100%" stop-color="#050505"/>
  </linearGradient>
  <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#FF4500" stop-opacity="0"/>
    <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.9"/>
  </radialGradient>
  <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="-100" y="-140" width="200" height="280" rx="18"/></clipPath>
  <clipPath id="avatarClip"><circle cx="0" cy="-58" r="46"/></clipPath>
</defs>

<!-- whole assembly drops in then swings forever -->
<g transform="translate(0,-140)">
  <animateTransform attributeName="transform" type="translate" values="0,-140;0,0;0,0" keyTimes="0;0.5;1" dur="1s" fill="freeze"/>

  <g transform="translate(180,40)">
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;10;-8;5;-3;2;-1;0;0" keyTimes="0;0.12;0.28;0.42;0.58;0.72;0.85;0.95;1"
      dur="5s" begin="1s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- strap -->
    <path d="M -14,0 C -14,120 -30,140 -30,180 L 30,180 C 30,140 14,120 14,0 Z" fill="url(#strap)" stroke="#7a2600" stroke-width="1"/>
    <text x="0" y="90" font-family="'Fira Code',Consolas,monospace" font-size="10" fill="#FFE4CC" text-anchor="middle" transform="rotate(90)">DIVYESH · DEV · DIVYESH · DEV</text>

    <!-- clasp -->
    <rect x="-16" y="176" width="32" height="16" rx="4" fill="#2b2b2b" stroke="#FF7A00" stroke-opacity="0.5"/>
    <circle cx="0" cy="200" r="10" fill="none" stroke="#8a8a8a" stroke-width="4"/>

    <!-- card -->
    <g transform="translate(0,340)">
      <rect x="-100" y="-140" width="200" height="280" rx="18" fill="url(#cardGrad)" stroke="#FF4500" stroke-opacity="0.5" stroke-width="1.5"/>

      <g clip-path="url(#cardClip)">
        <!-- avatar ring glow -->
        <circle cx="0" cy="-58" r="54" fill="url(#ringGlow)"/>
        <circle cx="0" cy="-58" r="47" fill="none" stroke="#FF7A00" stroke-width="2">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <g clip-path="url(#avatarClip)">
          <image href="assets/character.png?v=1" x="-90" y="-160" width="180" height="200" preserveAspectRatio="xMidYMin slice"/>
        </g>

        <text x="0" y="10" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">DIVYESH SONI</text>
        <text x="0" y="32" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#FF9E5E">Frontend · AI Builder</text>
        <text x="0" y="50" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="11" fill="#8a8a8a">@Divyezh</text>

        <!-- barcode -->
        <g transform="translate(-70,90)" fill="#FF9E5E">
          <rect x="0" y="0" width="2" height="26"/><rect x="4" y="0" width="1" height="26"/><rect x="7" y="0" width="3" height="26"/>
          <rect x="12" y="0" width="1" height="26"/><rect x="15" y="0" width="2" height="26"/><rect x="19" y="0" width="1" height="26"/>
          <rect x="22" y="0" width="3" height="26"/><rect x="27" y="0" width="1" height="26"/><rect x="30" y="0" width="2" height="26"/>
          <rect x="34" y="0" width="1" height="26"/><rect x="37" y="0" width="3" height="26"/><rect x="42" y="0" width="1" height="26"/>
          <rect x="45" y="0" width="2" height="26"/><rect x="49" y="0" width="1" height="26"/><rect x="52" y="0" width="3" height="26"/>
          <rect x="57" y="0" width="1" height="26"/><rect x="60" y="0" width="2" height="26"/><rect x="64" y="0" width="1" height="26"/>
          <rect x="67" y="0" width="3" height="26"/><rect x="72" y="0" width="1" height="26"/><rect x="75" y="0" width="2" height="26"/>
          <rect x="79" y="0" width="1" height="26"/><rect x="82" y="0" width="3" height="26"/><rect x="87" y="0" width="1" height="26"/>
          <rect x="90" y="0" width="2" height="26"/><rect x="94" y="0" width="1" height="26"/><rect x="97" y="0" width="3" height="26"/>
          <rect x="102" y="0" width="1" height="26"/><rect x="105" y="0" width="2" height="26"/><rect x="109" y="0" width="1" height="26"/>
          <rect x="112" y="0" width="3" height="26"/><rect x="117" y="0" width="1" height="26"/><rect x="120" y="0" width="2" height="26"/>
          <rect x="124" y="0" width="1" height="26"/><rect x="127" y="0" width="3" height="26"/><rect x="132" y="0" width="1" height="26"/>
          <rect x="135" y="0" width="2" height="26"/>
        </g>

        <!-- holographic shine sweep -->
        <rect x="-160" y="-160" width="80" height="320" fill="url(#shine)" transform="rotate(20)">
          <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;280,0;0,0" keyTimes="0;0.5;1" dur="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</g>
</svg>
