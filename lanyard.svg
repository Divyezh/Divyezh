<svg width="360" height="520" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <clipPath id="cardClip"><rect x="-100" y="-140" width="200" height="280" rx="16"/></clipPath>
  <clipPath id="avatarClip"><circle cx="0" cy="-58" r="46"/></clipPath>
</defs>

<!-- whole assembly drops in then swings smoothly -->
<g transform="translate(0,-140)">
  <animateTransform attributeName="transform" type="translate" values="0,-140;0,0;0,0" keyTimes="0;0.5;1" dur="1s" fill="freeze"/>

  <g transform="translate(180,40)">
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;8;-6;4;-2;1;-0.5;0;0" keyTimes="0;0.12;0.28;0.42;0.58;0.72;0.85;0.95;1"
      dur="5.5s" begin="1s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- Premium Amber Woven Strap -->
    <path d="M -14,0 C -14,120 -30,140 -30,180 L 30,180 C 30,140 14,120 14,0 Z" fill="#E8821A" stroke="#C2650D" stroke-width="1.2"/>
    <text x="0" y="90" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#0A0A0C" text-anchor="middle" transform="rotate(90)">DIVYESH · WEBRTC · DEV</text>

    <!-- Chrome / Slate Clasp -->
    <rect x="-16" y="176" width="32" height="16" rx="4" fill="#1A1A20" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="0" cy="200" r="10" fill="none" stroke="#71717A" stroke-width="3"/>

    <!-- ID Card (Solid Slate Card) -->
    <g transform="translate(0,340)">
      <rect x="-100" y="-140" width="200" height="280" rx="16" fill="#121216" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

      <g clip-path="url(#cardClip)">
        <!-- Top Amber Accent Bar -->
        <rect x="-100" y="-140" width="200" height="10" fill="#E8821A"/>

        <!-- Avatar Ring -->
        <circle cx="0" cy="-58" r="50" fill="#1A1A20"/>
        <circle cx="0" cy="-58" r="47" fill="none" stroke="#E8821A" stroke-width="2"/>
        <g clip-path="url(#avatarClip)">
          <image href="assets/character.png?v=1" x="-90" y="-160" width="180" height="200" preserveAspectRatio="xMidYMin slice"/>
        </g>

        <!-- Typography -->
        <text x="0" y="12" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="17" fill="#F4F4F5">DIVYESH SONI</text>
        <text x="0" y="32" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="600" fill="#FFAA44">WebRTC &amp; Frontend</text>
        <text x="0" y="48" text-anchor="middle" font-family="'Inter',sans-serif" font-size="10.5" fill="#A1A1AA">Creator of VIVA Meeting</text>

        <!-- Solid Barcode in #E8821A -->
        <g transform="translate(-70,82)" fill="#E8821A">
          <rect x="0" y="0" width="2" height="24"/><rect x="4" y="0" width="1" height="24"/><rect x="7" y="0" width="3" height="24"/>
          <rect x="12" y="0" width="1" height="24"/><rect x="15" y="0" width="2" height="24"/><rect x="19" y="0" width="1" height="24"/>
          <rect x="22" y="0" width="3" height="24"/><rect x="27" y="0" width="1" height="24"/><rect x="30" y="0" width="2" height="24"/>
          <rect x="34" y="0" width="1" height="24"/><rect x="37" y="0" width="3" height="24"/><rect x="42" y="0" width="1" height="24"/>
          <rect x="45" y="0" width="2" height="24"/><rect x="49" y="0" width="1" height="24"/><rect x="52" y="0" width="3" height="24"/>
          <rect x="57" y="0" width="1" height="24"/><rect x="60" y="0" width="2" height="24"/><rect x="64" y="0" width="1" height="24"/>
          <rect x="67" y="0" width="3" height="24"/><rect x="72" y="0" width="1" height="24"/><rect x="75" y="0" width="2" height="24"/>
          <rect x="79" y="0" width="1" height="24"/><rect x="82" y="0" width="3" height="24"/><rect x="87" y="0" width="1" height="24"/>
          <rect x="90" y="0" width="2" height="24"/><rect x="94" y="0" width="1" height="24"/><rect x="97" y="0" width="3" height="24"/>
          <rect x="102" y="0" width="1" height="24"/><rect x="105" y="0" width="2" height="24"/><rect x="109" y="0" width="1" height="24"/>
          <rect x="112" y="0" width="3" height="24"/><rect x="117" y="0" width="1" height="24"/><rect x="120" y="0" width="2" height="24"/>
          <rect x="124" y="0" width="1" height="24"/><rect x="127" y="0" width="3" height="24"/><rect x="132" y="0" width="1" height="24"/>
          <rect x="135" y="0" width="2" height="24"/>
        </g>
        <text x="0" y="118" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#71717A">ID: 2026-ENG-VIVA</text>
      </g>
    </g>
  </g>
</g>
</svg>
