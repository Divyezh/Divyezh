<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
<rect width="480" height="200" rx="14" fill="#0A0A0C" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>

<text x="24" y="34" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="17" fill="#F4F4F5">GitHub Proof of Work</text>

<!-- rank ring (Amber Solid Fill) -->
<g transform="translate(86,120)">
  <circle r="50" fill="none" stroke="#1A1A20" stroke-width="8"/>
  <circle r="50" fill="none" stroke="#E8821A" stroke-width="8" stroke-linecap="round"
    stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="314" to="42" dur="1.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </circle>
  <text x="0" y="6" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="22" fill="#F4F4F5" opacity="0">
    A+<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
  </text>
  <text x="0" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#71717A">ACTIVITY</text>
</g>

<!-- stat rows -->
<g font-family="'JetBrains Mono',monospace" font-size="13" fill="#A1A1AA">
  <g transform="translate(175,62)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="215,62" to="175,62" dur="0.4s" begin="0.4s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <text x="0" y="0">⭐ Total Stars Earned:</text><text x="260" y="0" fill="#FFAA44" font-weight="700">220+</text>
  </g>
  <g transform="translate(175,92)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="215,92" to="175,92" dur="0.4s" begin="0.6s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    <text x="0" y="0">📦 Total Repositories:</text><text x="260" y="0" fill="#FFAA44" font-weight="700">30+</text>
  </g>
  <g transform="translate(175,122)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="215,122" to="175,122" dur="0.4s" begin="0.8s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <text x="0" y="0">🔥 Commits (2026):</text><text x="260" y="0" fill="#FFAA44" font-weight="700">600+</text>
  </g>
  <g transform="translate(175,152)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="215,152" to="175,152" dur="0.4s" begin="1.0s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
    <text x="0" y="0">🔀 Pull Requests:</text><text x="260" y="0" fill="#FFAA44" font-weight="700">25+</text>
  </g>
</g>
<text x="24" y="182" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#71717A">Live GitHub API verified</text>
</svg>
