<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF4500"/>
    <stop offset="100%" stop-color="#FFB347"/>
  </linearGradient>
</defs>
<rect width="480" height="200" rx="14" fill="#0d0d0d" stroke="#FF4500" stroke-opacity="0.3"/>

<text x="24" y="34" font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Divyesh's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(90,120)">
  <circle r="52" fill="none" stroke="#1a0700" stroke-width="10"/>
  <circle r="52" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="327" to="45" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </circle>
  <text x="0" y="6" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" opacity="0">
    A+<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
  </text>
</g>

<!-- stat rows -->
<g font-family="'Fira Code',Consolas,monospace" font-size="14" fill="#FFD9B3">
  <g transform="translate(180,60)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="230,60" to="180,60" dur="0.5s" begin="0.5s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <text x="0" y="0">⭐ Total Stars Earned:</text><text x="260" y="0" fill="#FF9E5E" font-weight="700">220+</text>
  </g>
  <g transform="translate(180,90)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="230,90" to="180,90" dur="0.5s" begin="0.7s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
    <text x="0" y="0">📦 Total Repos:</text><text x="260" y="0" fill="#FF9E5E" font-weight="700">30+</text>
  </g>
  <g transform="translate(180,120)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="230,120" to="180,120" dur="0.5s" begin="0.9s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <text x="0" y="0">🔥 Commits (2026):</text><text x="260" y="0" fill="#FF9E5E" font-weight="700">600+</text>
  </g>
  <g transform="translate(180,150)" opacity="0">
    <animateTransform attributeName="transform" type="translate" from="230,150" to="180,150" dur="0.5s" begin="1.1s" fill="freeze" additive="sum"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <text x="0" y="0">🔀 Pull Requests:</text><text x="260" y="0" fill="#FF9E5E" font-weight="700">25+</text>
  </g>
</g>
<text x="24" y="182" font-family="'Fira Code',Consolas,monospace" font-size="10" fill="#5a5a5a">Update these numbers by hand as your stats grow</text>
</svg>
