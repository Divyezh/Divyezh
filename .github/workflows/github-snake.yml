name: Generate Snake Animation

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3am UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Divyezh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF4500&color_dots=%231a0700,%232a0900,%23FF7A00,%23FF4500,%23FFB347
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFB347&color_dots=%23161b22,%232a0900,%23FF7A00,%23FF4500,%23FFB347

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
