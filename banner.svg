<svg width="1280" height="740" viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#050505"><animate attributeName="stop-color" values="#050505;#180600;#050505" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="55%" stop-color="#120400"><animate attributeName="stop-color" values="#120400;#2a0900;#120400" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#000000"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FF4500"><animate attributeName="stop-color" values="#FF4500;#FFB347;#FF7A00;#FF4500" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#FF7A00"><animate attributeName="stop-color" values="#FF7A00;#FF4500;#FFB347;#FF7A00" dur="5s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#FFB347"><animate attributeName="stop-color" values="#FFB347;#FF7A00;#FF4500;#FFB347" dur="5s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FF7A00" stop-opacity="0"/>
    <stop offset="50%" stop-color="#FFB347" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FF7A00" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="roundedBanner"><rect width="1280" height="740" rx="22"/></clipPath>
  <clipPath id="charClip"><rect id="charClipRect" x="924" y="0" width="330" height="0"><animate attributeName="height" from="0" to="740" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/></rect></clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<g clip-path="url(#roundedBanner)">
<rect width="1280" height="740" fill="url(#bg)"/>

<!-- ambient orbs -->
<circle cx="120" cy="620" r="160" fill="#FF4500" opacity="0.08"><animate attributeName="opacity" values="0.05;0.14;0.05" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1150" cy="120" r="130" fill="#FFB347" opacity="0.07"><animate attributeName="opacity" values="0.04;0.12;0.04" dur="8s" repeatCount="indefinite"/></circle>

<!-- floating particles -->
<circle cx="80" cy="90" r="2" fill="#FF7A00" opacity="0.7"><animate attributeName="cy" values="90;40;90" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="680" r="2.4" fill="#FFB347" opacity="0.6"><animate attributeName="cy" values="680;620;680" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="60" cy="400" r="1.8" fill="#FF4500" opacity="0.5"><animate attributeName="cy" values="400;350;400" dur="5.5s" repeatCount="indefinite"/></circle>
<circle cx="1240" cy="500" r="2" fill="#FF7A00" opacity="0.6"><animate attributeName="cy" values="500;450;500" dur="6.5s" repeatCount="indefinite"/></circle>

<!-- terminal window -->
<g transform="translate(48,44)">
  <rect width="560" height="150" rx="12" fill="#0d0d0d" stroke="#FF4500" stroke-opacity="0.35"/>
  <circle cx="24" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="24" r="6" fill="#27C93F"/>
  <g font-family="'Fira Code',Consolas,monospace" font-size="16" fill="#FF9E5E">
    <clipPath id="typeClip1"><rect x="0" y="52" width="0" height="24"><animate attributeName="width" from="0" to="480" dur="1.8s" begin="0.1s" fill="freeze"/></rect></clipPath>
    <text x="24" y="70" clip-path="url(#typeClip1)">user@dev:~$ cat README.md</text>
    <rect x="24" y="56" width="9" height="18" fill="#FFB347"><animate attributeName="x" from="24" to="336" dur="1.8s" begin="0.1s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="1.9s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="'Fira Code',Consolas,monospace" font-size="14" fill="#8a8a8a">
    <clipPath id="typeClip2"><rect x="0" y="92" width="0" height="22"><animate attributeName="width" from="0" to="480" dur="1.4s" begin="2s" fill="freeze"/></rect></clipPath>
    <text x="24" y="108" clip-path="url(#typeClip2)">&gt; Loading profile... AI &amp; frontend engineer detected ✓</text>
  </g>
</g>

<!-- name -->
<g font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.3s" fill="freeze"/>
  <text x="48" y="300" font-size="72" fill="url(#nameGrad)">Divyesh Soni</text>
</g>

<!-- cycling role titles -->
<g font-family="'Fira Code',Consolas,monospace" font-size="26" fill="#FFD9B3">
  <text x="50" y="345" opacity="0">Frontend Developer<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="10s" begin="2.8s" repeatCount="indefinite"/></text>
  <text x="50" y="345" opacity="0">AI / SaaS Builder<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.34;0.5;0.55;1" dur="10s" begin="2.8s" repeatCount="indefinite"/></text>
  <text x="50" y="345" opacity="0">Creator of VELVET.AI<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.62;0.78;0.83;1" dur="10s" begin="2.8s" repeatCount="indefinite"/></text>
  <text x="50" y="345" opacity="0">React · Next.js · TypeScript<animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.83;0.85;0.9;0.98;1" dur="10s" begin="2.8s" repeatCount="indefinite"/></text>
</g>

<!-- quote box -->
<g transform="translate(48,378)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="3.4s" fill="freeze"/>
  <rect width="740" height="56" rx="10" fill="#0d0d0d" stroke="#FF7A00" stroke-opacity="0.4"/>
  <text x="20" y="35" font-family="'Fira Code',Consolas,monospace" font-size="16" fill="#FFB347">"Don't just build products — build experiences that feel alive."</text>
</g>

<!-- tech pills -->
<g font-family="'Fira Code',Consolas,monospace" font-size="14" font-weight="600">
  <g id="pillsRow">
  </g>
  <!-- pill template repeated -->
  <g transform="translate(48,452)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.7s" fill="freeze"/><rect width="94" height="32" rx="16" fill="#1a0700" stroke="#FF4500"/><text x="47" y="21" text-anchor="middle" fill="#FF9E5E">React</text></g>
  <g transform="translate(152,452)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.8s" fill="freeze"/><rect width="106" height="32" rx="16" fill="#1a0700" stroke="#FF4500"/><text x="53" y="21" text-anchor="middle" fill="#FF9E5E">Next.js</text></g>
  <g transform="translate(268,452)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.9s" fill="freeze"/><rect width="130" height="32" rx="16" fill="#1a0700" stroke="#FF4500"/><text x="65" y="21" text-anchor="middle" fill="#FF9E5E">TypeScript</text></g>
  <g transform="translate(408,452)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4s" fill="freeze"/><rect width="104" height="32" rx="16" fill="#1a0700" stroke="#FF4500"/><text x="52" y="21" text-anchor="middle" fill="#FF9E5E">Node.js</text></g>
  <g transform="translate(522,452)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.1s" fill="freeze"/><rect width="130" height="32" rx="16" fill="#1a0700" stroke="#FF4500"/><text x="65" y="21" text-anchor="middle" fill="#FF9E5E">Tailwind</text></g>
  <g transform="translate(662,452)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.2s" fill="freeze"/><rect width="108" height="32" rx="16" fill="#1a0700" stroke="#FF4500"/><text x="54" y="21" text-anchor="middle" fill="#FF9E5E">AI/LLM</text></g>
</g>

<!-- stats bar -->
<g transform="translate(48,512)" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#FFD9B3">
  <text x="0" y="0">Frontend</text>
  <rect x="0" y="10" width="220" height="8" rx="4" fill="#1a0700"/>
  <rect x="0" y="10" width="0" height="8" rx="4" fill="url(#nameGrad)"><animate attributeName="width" from="0" to="200" dur="1.2s" begin="4.3s" fill="freeze"/></rect>

  <text x="250" y="0">AI Integration</text>
  <rect x="250" y="10" width="220" height="8" rx="4" fill="#1a0700"/>
  <rect x="250" y="10" width="0" height="8" rx="4" fill="url(#nameGrad)"><animate attributeName="width" from="0" to="180" dur="1.2s" begin="4.5s" fill="freeze"/></rect>

  <text x="500" y="0">UI Motion</text>
  <rect x="500" y="10" width="220" height="8" rx="4" fill="#1a0700"/>
  <rect x="500" y="10" width="0" height="8" rx="4" fill="url(#nameGrad)"><animate attributeName="width" from="0" to="190" dur="1.2s" begin="4.7s" fill="freeze"/></rect>
</g>

<!-- code card -->
<g transform="translate(48,556)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="4.9s" fill="freeze"/>
  <rect width="740" height="140" rx="12" fill="#0d0d0d" stroke="#FF4500" stroke-opacity="0.35"/>
  <circle cx="22" cy="22" r="5" fill="#FF5F56"/><circle cx="40" cy="22" r="5" fill="#FFBD2E"/><circle cx="58" cy="22" r="5" fill="#27C93F"/>
  <g font-family="'Fira Code',Consolas,monospace" font-size="14">
    <text x="20" y="52" fill="#FF9E5E">function <tspan fill="#FFB347">buildDreams</tspan>() {</text>
    <text x="40" y="76" fill="#8a8a8a" opacity="0">const passion = "code";<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.2s" fill="freeze"/></text>
    <text x="40" y="98" fill="#8a8a8a" opacity="0">return passion + coffee + hustle;<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.5s" fill="freeze"/></text>
    <text x="20" y="120" fill="#FF9E5E" opacity="0">}<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.8s" fill="freeze"/></text>
  </g>
</g>

<!-- neon sign -->
<g font-family="'Poppins','Segoe UI',sans-serif" font-weight="700" font-size="20" filter="url(#glow)">
  <text x="48" y="716" fill="#FFB347" opacity="0.9">
    KEEP CODING · KEEP GROWING
    <animate attributeName="opacity" values="0.9;0.2;0.9;0.9;0.15;0.9;0.9" keyTimes="0;0.08;0.1;0.5;0.53;0.55;1" dur="4.5s" repeatCount="indefinite"/>
  </text>
</g>

<!-- character hologram -->
<g clip-path="url(#charClip)">
  <image href="assets/character.png?v=1" x="900" y="30" width="360" height="680" preserveAspectRatio="xMidYMax slice"/>
</g>
<rect x="924" y="0" width="330" height="60" fill="url(#scanGrad)" clip-path="url(#roundedBanner)">
  <animate attributeName="y" values="-60;740" dur="3.5s" begin="2s" repeatCount="indefinite"/>
</rect>

</g>
<rect width="1280" height="740" rx="22" fill="none" stroke="#FF4500" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
